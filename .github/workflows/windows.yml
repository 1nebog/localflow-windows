# Проверка на чистом Windows после каждого изменения.
# Бесплатно: репозиторий публичный.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # кириллица в выводе на Windows
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка
        run: python -m pip install -r requirements-dev.txt

      - name: Проверки (текст как на Mac, клавиша, запись, вставка в окно)
        run: python -m pytest -v tests --ignore=tests/test_core_golden.py

      - name: Текстовая логика совпадает с версией для Mac
        run: python -m pytest -q tests/test_core_golden.py

      - name: Снимок таблетки и нагрузка на процессор
        run: python tools/pill_snapshot.py build/pill.png

      - name: Снимок окна панели
        run: python tools/panel_snapshot.py build/panel.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pill-snapshot
          path: build/*.png
          retention-days: 14
