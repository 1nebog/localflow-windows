# Проверка на чистом Windows после каждого изменения.
# Бесплатно: репозиторий публичный.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка
        run: python -m pip install -r requirements-dev.txt

      - name: Текстовая логика совпадает с версией для Mac
        run: python -m pytest -q tests
